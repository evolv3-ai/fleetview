[project]
name = "fleetview"
version = "0.2.0"
description = "Sentinel Fleet Dashboard - TUI for monitoring server fleets (Rust Sentinel over SSH)"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89.0",
    "asyncssh>=2.17",
]

[project.scripts]
fleetview = "fleetview.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleetview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
